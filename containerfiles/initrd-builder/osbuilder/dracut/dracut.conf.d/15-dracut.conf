# Custom RHEL dracut config for kata initrd/rootfs generation


# Fedora: kernel drivers we want in the initrd.
drivers+=" "
# virtio vsock
drivers+=" vmw_vsock_virtio_transport "
# virtio net
drivers+=" virtio_net "
# virtio fs
drivers+=" virtiofs "
# virtio block
drivers+=" virtio_blk "
# virtio scsi
drivers+=" virtio_scsi "
# SCSI disk driver
drivers+=" sd_mod "
# virtio serial. Could be dropped eventually, vsock covers us
drivers+=" virtio_console "
# loop
drivers+=" loop "
# ext4
drivers+=" ext4 "
# xfs
drivers+=" xfs "
# VFIO
drivers+=" vfio_pci vfio_iommu_type1 fuse loop overlay "
# ptp_kvm
drivers+=" ptp_kvm "

# Fedora: extra dracut modules
#dracutmodules+=" "

dracutmodules+=" systemd-journald systemd-modules-load systemd-coredump "
# These aid debugging
dracutmodules+=" syslog systemd dbus "
# Required for storage
add_dracutmodules+=" kernel-modules crypt udev-rules "
# Storage library packages
install_items+=" \
 /usr/lib64/libcrack.so.* \
 /usr/lib64/libpwquality.so.* \
 /usr/lib64/libparted.so.* \
 /usr/lib64/libblkid.so.* \
 /usr/lib64/libuuid.so.* \
"
# Storage utility packages
install_items+=" \
 /usr/bin/lsblk \
 /usr/sbin/cryptsetup \
 /usr/sbin/mkfs.xfs \
 /usr/sbin/mkfs.ext4 \
 /usr/sbin/xfs_growfs \
 /usr/bin/udevadm \
 /usr/share/cracklib/pw_dict.pwd \
 /usr/share/cracklib/pw_dict.hwm \
 /usr/share/cracklib/pw_dict.pwi \
"
# Storage drivers
add_drivers+=" \
 dm_mod \
 dm_crypt \
"
